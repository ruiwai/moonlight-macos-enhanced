name: PyroWave prerequisites

on:
  push:
    branches: ['pyrowave/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-golden-tests:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Test offline metallib packaging (mocked tools, CPU only)
        run: python3 tests/pyrowave/test_metallib_build.py

      - name: Initialize only the pinned Common submodule
        run: |
          git -c submodule.recurse=false submodule update --init --checkout -- \
            moonlight-common/moonlight-common-c

      - name: Compile Common goldens and native checks with sanitizers
        run: |
          common=moonlight-common/moonlight-common-c
          # Match Common CMake's C11, src includes, and warning flags.
          # Neither golden-test target has extra compile definitions.
          flags=(-std=c11 -Wall -Wextra -Werror -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          xcrun clang "${flags[@]}" -I "$common/src" \
            "$common/tests/PyrowaveProtocolGoldenTest.c" \
            "$common/src/PyrowaveProtocol.c" \
            -o "$RUNNER_TEMP/pyrowave-protocol-golden-tests"
          xcrun clang "${flags[@]}" -I "$common/src" \
            "$common/tests/PyrowaveReassemblyGoldenTest.c" \
            "$common/src/PyrowaveProtocol.c" \
            "$common/src/PyrowaveReassembly.c" \
            -o "$RUNNER_TEMP/pyrowave-reassembly-golden-tests"
          xcrun clang "${flags[@]}" -I "$common/src" -I Limelight/Stream/PyroWave \
            tests/pyrowave/test_metadata.c \
            Limelight/Stream/PyroWave/MLPyrowaveMetadata.c \
            -o "$RUNNER_TEMP/pyrowave-metadata-tests"
          xcrun clang "${flags[@]}" -I "$common/src" -I Limelight/Stream/PyroWave \
            tests/pyrowave/test_reassembly.c \
            Limelight/Stream/PyroWave/MLPyrowaveReassembly.c \
            Limelight/Stream/PyroWave/MLPyrowaveMetadata.c \
            "$common/src/PyrowaveProtocol.c" "$common/src/PyrowaveReassembly.c" \
            -o "$RUNNER_TEMP/pyrowave-strict-reassembly-tests"
          # The whitebox fixture includes the native adapter exactly once.
          xcrun clang "${flags[@]}" -I "$common/src" -I Limelight/Stream/PyroWave \
            tests/pyrowave/test_reassembly_arena.c \
            Limelight/Stream/PyroWave/MLPyrowaveMetadata.c \
            "$common/src/PyrowaveProtocol.c" "$common/src/PyrowaveReassembly.c" \
            -o "$RUNNER_TEMP/pyrowave-reassembly-arena-tests"

      - name: Run Common goldens and native checks
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          "$RUNNER_TEMP/pyrowave-protocol-golden-tests"
          "$RUNNER_TEMP/pyrowave-reassembly-golden-tests"
          "$RUNNER_TEMP/pyrowave-metadata-tests"
          "$RUNNER_TEMP/pyrowave-strict-reassembly-tests"
          "$RUNNER_TEMP/pyrowave-reassembly-arena-tests"

      - name: Compile and run standalone payload pool (no Common or GPU)
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          flags=(-std=c++14 -pthread -Wall -Wextra -Werror -pedantic -g -O1
                 '-fsanitize=address,undefined' -fno-sanitize-recover=all -fno-omit-frame-pointer)
          xcrun clang++ "${flags[@]}" -I Limelight/Stream/PyroWave \
            tests/pyrowave/test_payload_pool.cpp -o "$RUNNER_TEMP/pyrowave-payload-pool"
          "$RUNNER_TEMP/pyrowave-payload-pool"

      - name: Compile and run standalone codec checks with fatal sanitizers
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          flags=(-std=c++14 -Wall -Wextra -Werror -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          xcrun clang++ "${flags[@]}" \
            -I moonlight-common/moonlight-common-c/src -I Limelight/Stream/PyroWave \
            Limelight/Stream/PyroWave/MLPyrowaveCodec.cpp tests/pyrowave/test_codec.cpp \
            -o "$RUNNER_TEMP/pyrowave-codec-tests"
          "$RUNNER_TEMP/pyrowave-codec-tests"

      - name: Compile CPU composition smoke with C11 and C++14 sanitizers
        run: |
          common=moonlight-common/moonlight-common-c/src
          native=Limelight/Stream/PyroWave
          flags=(-Wall -Wextra -Werror -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          sources=("$common/PyrowaveProtocol.c" "$common/PyrowaveReassembly.c"
                   "$native/MLPyrowaveMetadata.c" "$native/MLPyrowaveReassembly.c")
          objects=()
          for source in "${sources[@]}"; do
            object="$RUNNER_TEMP/$(basename "${source%.c}")-pipeline.o"
            xcrun clang -std=c11 "${flags[@]}" -I "$common" -I "$native" -c "$source" -o "$object"
            objects+=("$object")
          done
          xcrun clang++ -std=c++14 "${flags[@]}" -I "$common" -I "$native" \
            "$native/MLPyrowaveCodec.cpp" tests/pyrowave/test_pipeline.cpp "${objects[@]}" \
            -o "$RUNNER_TEMP/pyrowave-pipeline-tests"
          xcrun clang++ -std=c++14 "${flags[@]}" -I "$common" -I "$native" \
            "$native/MLPyrowaveCodec.cpp" "$native/MLPyrowaveReceiver.cpp" \
            tests/pyrowave/test_receiver.cpp "${objects[@]}" \
            -o "$RUNNER_TEMP/pyrowave-receiver-tests"
          cpp_objects=()
          for source in "$native/MLPyrowaveCodec.cpp" "$native/MLPyrowaveReceiver.cpp"; do
            object="$RUNNER_TEMP/$(basename "${source%.cpp}")-coordinator.o"
            xcrun clang++ -std=c++14 "${flags[@]}" -I "$common" -I "$native" \
              -c "$source" -o "$object"
            cpp_objects+=("$object")
          done
          xcrun clang++ -std=c++14 -fobjc-arc "${flags[@]}" -I "$common" -I "$native" \
            "$native/MLPyrowaveCoordinator.mm" tests/pyrowave/test_coordinator.mm \
            "${cpp_objects[@]}" "${objects[@]}" -framework Foundation \
            -o "$RUNNER_TEMP/pyrowave-coordinator-tests"

      - name: Run finite CPU composition mutation smoke (not a fuzz campaign)
        timeout-minutes: 3
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          "$RUNNER_TEMP/pyrowave-pipeline-tests"
          "$RUNNER_TEMP/pyrowave-receiver-tests"
          "$RUNNER_TEMP/pyrowave-coordinator-tests"

      - name: Actual Common raw callback to owned coordinator and watchdog (CPU only)
        timeout-minutes: 3
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          common=moonlight-common/moonlight-common-c
          native=Limelight/Stream/PyroWave
          build="$RUNNER_TEMP/pyrowave-common-build"
          openssl="$(brew --prefix openssl@3)"
          git -C "$common" -c submodule.recurse=false submodule update --init --checkout -- enet
          flags=(-Wall -Wextra -Werror -g -O1 '-fsanitize=address,undefined'
                 -fno-sanitize-recover=all -fno-omit-frame-pointer)
          san='-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
          cmake -S "$common" -B "$build" -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=ON -DOPENSSL_ROOT_DIR="$openssl" \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" -DCMAKE_C_FLAGS="$san" \
            -DCMAKE_EXE_LINKER_FLAGS="$san" -DCMAKE_SHARED_LINKER_FLAGS="$san"
          cmake --build "$build" --parallel 3 --target moonlight-common-c \
            pyrowave-packet-callback-test pyrowave-negotiation-test
          ctest --test-dir "$build" --output-on-failure --no-tests=error \
            -R '^(pyrowave-packet-callback-test|pyrowave-negotiation-test)$'
          xcrun clang -std=c11 -DHAS_SOCKLEN_T "${flags[@]}" \
            -I "$common/src" -I "$common/enet/include" -I "$openssl/include" \
            -c tests/pyrowave/common_coordinator_transport.c \
            -o "$RUNNER_TEMP/common-coordinator-transport.o"
          # Use the full dylib, never standalone Common protocol/reassembly objects.
          xcrun clang -std=c11 -fobjc-arc "${flags[@]}" -I "$common/src" -I "$native" \
            -c "$native/MLPyrowavePacketBridge.m" -o "$RUNNER_TEMP/pyrowave-packet-bridge.o"
          objects=("$RUNNER_TEMP/MLPyrowaveCodec-coordinator.o"
                   "$RUNNER_TEMP/MLPyrowaveReceiver-coordinator.o"
                   "$RUNNER_TEMP/MLPyrowaveMetadata-pipeline.o"
                   "$RUNNER_TEMP/MLPyrowaveReassembly-pipeline.o"
                   "$RUNNER_TEMP/common-coordinator-transport.o"
                   "$RUNNER_TEMP/pyrowave-packet-bridge.o")
          xcrun clang++ -std=c++14 -fobjc-arc "${flags[@]}" -I "$common/src" -I "$native" \
            "$native/MLPyrowaveCoordinator.mm" tests/pyrowave/test_common_coordinator.mm \
            "${objects[@]}" -L "$build" -lmoonlight-common-c -Wl,-rpath,"$build" \
            -framework Foundation -o "$RUNNER_TEMP/pyrowave-common-coordinator-tests"
          "$RUNNER_TEMP/pyrowave-common-coordinator-tests"

      - name: Compile and run standalone CPU draw gate (no GPU skip)
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          flags=(-Wall -Wextra -Werror -g -O1 '-fsanitize=address,undefined'
                 -fno-sanitize-recover=all -fno-omit-frame-pointer)
          xcrun clang -std=c11 "${flags[@]}" -I Limelight/Stream/PyroWave \
            tests/pyrowave/test_draw_gate.c -o "$RUNNER_TEMP/pyrowave-draw-gate-c"
          xcrun clang++ -x c++ -std=c++14 "${flags[@]}" -I Limelight/Stream/PyroWave \
            tests/pyrowave/test_draw_gate.c -o "$RUNNER_TEMP/pyrowave-draw-gate-cpp"
          "$RUNNER_TEMP/pyrowave-draw-gate-c"
          "$RUNNER_TEMP/pyrowave-draw-gate-cpp"

      - name: Compile and run portable event stats (no GPU skip)
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          flags=(-Wall -Wextra -Werror -pedantic -g -O1 '-fsanitize=address,undefined'
                 -fno-sanitize-recover=all -fno-omit-frame-pointer -I Limelight/Stream/PyroWave)
          xcrun clang -std=c11 "${flags[@]}" tests/pyrowave/test_stats.c -o "$RUNNER_TEMP/stats-c"
          xcrun clang++ -x c++ -std=c++14 "${flags[@]}" tests/pyrowave/test_stats.c -o "$RUNNER_TEMP/stats-cpp"
          "$RUNNER_TEMP/stats-c"
          "$RUNNER_TEMP/stats-cpp"

      - name: Compile and probe Metal pipelines (not decode pixels)
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          flags=(-std=c++14 -fobjc-arc -Wall -Wextra -Werror -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          xcrun clang++ "${flags[@]}" -I Limelight/Stream/PyroWave \
            Limelight/Stream/PyroWave/MLPyrowaveMetalKernels.mm tests/pyrowave/test_metal_kernels.mm \
            -framework Foundation -framework Metal -o "$RUNNER_TEMP/pyrowave-metal-kernels-tests"
          app="$RUNNER_TEMP/PyroWave Kernels.app"
          mkdir -p "$app/Contents/MacOS"
          python3 scripts/build_pyrowave_metallibs.py \
            --output "$app/Contents/Resources/PyroWave" --work "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/pyrowave-metal-kernels-tests" "$app/Contents/MacOS/kernels"
          python3 - "$app/Contents/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'wb') as f:
              plistlib.dump({'CFBundleExecutable': 'kernels',
                            'CFBundleIdentifier': 'com.moonlight.pyrowave.kernel-tests',
                            'CFBundlePackageType': 'APPL'}, f)
          PY
          for mode in runtime bundled; do
            command=("$RUNNER_TEMP/pyrowave-metal-kernels-tests")
            if [ "$mode" = bundled ]; then command=("$app/Contents/MacOS/kernels" --bundled); fi
            if "${command[@]}"; then
              echo "Metal $mode library/pipeline checks passed; no pixel validation" >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              if [ "$status" -eq 77 ]; then
                echo "::notice::Metal $mode checks SKIPPED (77): supported device unavailable"
                echo "Metal $mode checks SKIPPED (77), not a GPU pass" >> "$GITHUB_STEP_SUMMARY"
              else
                exit "$status"
              fi
            fi
          done

      - name: Compile and run actual Metal decoder synthetic smoke (not pixel correctness)
        timeout-minutes: 3
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          common=moonlight-common/moonlight-common-c/src
          native=Limelight/Stream/PyroWave
          flags=(-std=c++14 -fobjc-arc -Wall -Wextra -Werror -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          objects=("$RUNNER_TEMP/MLPyrowaveCodec-coordinator.o"
                   "$RUNNER_TEMP/MLPyrowaveReceiver-coordinator.o"
                   "$RUNNER_TEMP/PyrowaveProtocol-pipeline.o"
                   "$RUNNER_TEMP/PyrowaveReassembly-pipeline.o"
                   "$RUNNER_TEMP/MLPyrowaveMetadata-pipeline.o"
                   "$RUNNER_TEMP/MLPyrowaveReassembly-pipeline.o")
          xcrun clang++ "${flags[@]}" -I "$common" -I "$native" \
            "$native/MLPyrowaveMetalDecoder.mm" "$native/MLPyrowaveMetalKernels.mm" \
            "$native/MLPyrowaveCoordinator.mm" tests/pyrowave/test_metal_decoder.mm \
            "${objects[@]}" -framework Foundation -framework Metal \
            -o "$RUNNER_TEMP/pyrowave-metal-decoder-tests"
          app="$RUNNER_TEMP/PyroWave Decoder.app"
          cp -R "$RUNNER_TEMP/PyroWave Kernels.app" "$app"
          cp "$RUNNER_TEMP/pyrowave-metal-decoder-tests" "$app/Contents/MacOS/kernels"
          # Keep CFBundleExecutable=kernels and the identical compiled resources.
          for mode in runtime bundled; do
            command=("$RUNNER_TEMP/pyrowave-metal-decoder-tests")
            if [ "$mode" = bundled ]; then command=("$app/Contents/MacOS/kernels"); fi
            if "${command[@]}"; then
              echo "Metal decoder $mode synthetic submission/completion smoke passed; NOT pixel correctness or feature readiness" >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              if [ "$status" -eq 77 ]; then
                echo "::notice::Metal decoder $mode hardware smoke SKIPPED (77): macOS 13/Apple7 device unavailable; CPU factory checks passed"
                echo "Metal decoder $mode hardware smoke SKIPPED (77); CPU factory checks passed; no GPU correctness result" >> "$GITHUB_STEP_SUMMARY"
              else
                exit "$status"
              fi
            fi
          done

      - name: Compile and run standalone Metal renderer offscreen smoke
        timeout-minutes: 3
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          common=moonlight-common/moonlight-common-c/src
          native=Limelight/Stream/PyroWave
          flags=(-std=c++14 -fobjc-arc -Wall -Wextra -Werror -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          objects=("$RUNNER_TEMP/MLPyrowaveCodec-coordinator.o"
                   "$RUNNER_TEMP/MLPyrowaveReceiver-coordinator.o"
                   "$RUNNER_TEMP/PyrowaveProtocol-pipeline.o"
                   "$RUNNER_TEMP/PyrowaveReassembly-pipeline.o"
                   "$RUNNER_TEMP/MLPyrowaveMetadata-pipeline.o"
                   "$RUNNER_TEMP/MLPyrowaveReassembly-pipeline.o")
          xcrun clang++ "${flags[@]}" -I "$common" -I "$native" \
            "$native/MLPyrowaveMetalRenderer.mm" "$native/MLPyrowaveMetalDecoder.mm" \
            "$native/MLPyrowaveMetalKernels.mm" "$native/MLPyrowaveCoordinator.mm" \
            tests/pyrowave/test_metal_renderer.mm "${objects[@]}" \
            -framework Foundation -framework Metal -framework QuartzCore \
            -o "$RUNNER_TEMP/pyrowave-metal-renderer-tests"
          app="$RUNNER_TEMP/PyroWave Renderer.app"
          cp -R "$RUNNER_TEMP/PyroWave Kernels.app" "$app"
          cp "$RUNNER_TEMP/pyrowave-metal-renderer-tests" "$app/Contents/MacOS/kernels"
          # Keep CFBundleExecutable=kernels; decoder/renderer accept no --bundled flag.
          for mode in runtime bundled; do
            command=("$RUNNER_TEMP/pyrowave-metal-renderer-tests")
            if [ "$mode" = bundled ]; then command=("$app/Contents/MacOS/kernels"); fi
            if "${command[@]}"; then
              echo "Metal renderer $mode offscreen zero-frame/range/letterbox smoke passed; NOT full encoder pixel correctness or drawable/UI presentation" >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              if [ "$status" -eq 77 ]; then
                echo "::notice::Metal renderer $mode hardware smoke SKIPPED (77): macOS 13/Apple7 device unavailable; CPU factory checks passed"
                echo "Metal renderer $mode hardware smoke SKIPPED (77); CPU factory checks passed; no GPU rendering result" >> "$GITHUB_STEP_SUMMARY"
              else
                exit "$status"
              fi
            fi
          done

      - name: Checkout pinned CPU packetizer oracle
        uses: actions/checkout@v6
        with:
          repository: AlkaidLab/pyrowave
          ref: cc91cbf6363721d19d135d05ca8e3d8665ea6afd
          path: .ci-pyrowave-codec
          submodules: false
          persist-credentials: false

      - name: Compile and run pinned CPU packetizer oracle with fatal sanitizers
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          test "$(git -C .ci-pyrowave-codec rev-parse HEAD)" = \
            cc91cbf6363721d19d135d05ca8e3d8665ea6afd
          flags=(-std=c++14 -Wall -Wextra -g -O1
                 '-fsanitize=address,undefined' -fno-omit-frame-pointer)
          # Upstream has existing warnings; isolate it without -Werror.
          xcrun clang++ "${flags[@]}" -I .ci-pyrowave-codec/metal -c \
            .ci-pyrowave-codec/metal/pyrowave_bitstream.cpp \
            -o "$RUNNER_TEMP/pyrowave-bitstream.o"
          xcrun clang++ "${flags[@]}" -Werror \
            -I .ci-pyrowave-codec/metal \
            -I moonlight-common/moonlight-common-c/src -I Limelight/Stream/PyroWave \
            Limelight/Stream/PyroWave/MLPyrowaveCodec.cpp tests/pyrowave/test_packetizer.cpp \
            "$RUNNER_TEMP/pyrowave-bitstream.o" -o "$RUNNER_TEMP/pyrowave-packetizer-tests"
          "$RUNNER_TEMP/pyrowave-packetizer-tests"
